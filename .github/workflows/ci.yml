name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:ci

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: safefleet
          POSTGRES_PASSWORD: safefleet_ci
          POSTGRES_DB: safefleet
        ports:
          - 6543:5432
        options: >-
          --health-cmd "pg_isready -U safefleet -d safefleet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 6543
      DATABASE_USER: safefleet
      DATABASE_PASSWORD: safefleet_ci
      DATABASE_NAME: safefleet
      DATABASE_SSL: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply database migrations
        run: npm run migration:run

      - name: Verify migrations are idempotent
        run: npm run migration:run

  docker-smoke:
    needs: [validate, database-migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare development environment
        run: cp .env.example .env

      - name: Start complete Docker stack
        run: docker compose up --build -d

      - name: Wait for backend readiness
        shell: bash
        run: |
          for attempt in {1..36}; do
            if curl --fail --silent http://localhost:6100/api/v1/health/ready > /dev/null; then
              exit 0
            fi
            echo "Waiting for SafeFleet backend (${attempt}/36)..."
            sleep 5
          done
          curl --fail --show-error http://localhost:6100/api/v1/health/ready

      - name: Verify seeded owner login and protected endpoint
        shell: bash
        run: |
          TOKEN=$(curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"organizationSlug":"safefleet-demo","email":"admin@safefleet.local","password":"ChangeMe123!"}' \
            http://localhost:6100/api/v1/auth/login \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["accessToken"])')
          test -n "$TOKEN"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            http://localhost:6100/api/v1/auth/me > /dev/null

      - name: Verify safety intelligence pipeline
        shell: bash
        run: bash scripts/ci/smoke-safety-intelligence.sh

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v
