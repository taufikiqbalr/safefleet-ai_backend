services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: safefleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-safefleet}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-safefleet_dev}
      POSTGRES_DB: ${DATABASE_NAME:-safefleet}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-safefleet} -d ${DATABASE_NAME:-safefleet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - safefleet

  migrate:
    build:
      context: .
      target: development
    container_name: safefleet-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "migration:run"]
    networks:
      - safefleet

  backend:
    build:
      context: .
      target: development
    container_name: safefleet-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safefleet

networks:
  safefleet:
    name: safefleet-network

volumes:
  postgres_data:
    name: safefleet-postgres-data
